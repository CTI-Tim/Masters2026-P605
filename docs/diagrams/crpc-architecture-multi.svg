<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="390" viewBox="0 0 1330 390" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <g id="ui"><rect x="-100" y="-28" width="200" height="56" rx="6" fill="#ffffff" stroke="#3b78c4" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="18" fill="#111">CH5 Panel or XPanel</text></g>
    <g id="uiconn"><rect x="-125" y="-28" width="250" height="56" rx="6" fill="#ffffff" stroke="#555555" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="18" font-family="Consolas, Menlo, monospace" fill="#111">CrpcUiConnection()</text></g>
    <g id="hwconn"><rect x="-125" y="-28" width="250" height="56" rx="6" fill="#ffffff" stroke="#555555" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="18" font-family="Consolas, Menlo, monospace" fill="#111">CrpcHardwareConnection()</text></g>
    <g id="hw"><rect x="-100" y="-28" width="200" height="56" rx="6" fill="#ffffff" stroke="#3a9a52" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="18" fill="#111">DM-NAX-8ZSA</text></g>
    <g id="hw2"><rect x="-100" y="-28" width="200" height="56" rx="6" fill="#ffffff" stroke="#3a9a52" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="18" fill="#111">DM-NAX-4ZSA</text></g>
    <g id="hw3"><rect x="-100" y="-28" width="200" height="56" rx="6" fill="#ffffff" stroke="#3a9a52" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="18" fill="#111">CRPC-enabled device</text></g>
    <g id="dots" fill="#555"><circle cx="0" cy="-12" r="3"/><circle cx="0" cy="0" r="3"/><circle cx="0" cy="12" r="3"/></g>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Column groups -->
  <rect x="20" y="20" width="230" height="350" rx="10" fill="#e8f1fb" stroke="#3b78c4" stroke-width="1.5"/>
  <text x="135" y="47" text-anchor="middle" font-size="18" font-weight="bold" fill="black">UI</text>

  <rect x="270" y="20" width="790" height="350" rx="10" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
  <text x="665" y="47" text-anchor="middle" font-size="18" font-weight="bold" fill="black">Program</text>

  <rect x="1080" y="20" width="230" height="350" rx="10" fill="#e9f6ec" stroke="#3a9a52" stroke-width="1.5"/>
  <text x="1195" y="47" text-anchor="middle" font-size="18" font-weight="bold" fill="black">Hardware</text>

  <!-- Rows: y = 110, 190, (ellipsis 255), 320 -->
  <use href="#ui" x="135" y="110"/>
  <use href="#ui" x="135" y="190"/>
  <use href="#dots" x="135" y="255"/>
  <use href="#ui" x="135" y="320"/>

  <use href="#uiconn" x="420" y="110"/>
  <use href="#uiconn" x="420" y="190"/>
  <use href="#dots" x="420" y="255"/>
  <use href="#uiconn" x="420" y="320"/>

  <rect x="605" y="145" width="120" height="130" rx="6" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/>
  <text x="665" y="216" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Broker</text>

  <use href="#hwconn" x="910" y="110"/>
  <use href="#hwconn" x="910" y="190"/>
  <use href="#dots" x="910" y="255"/>
  <use href="#hwconn" x="910" y="320"/>

  <use href="#hw" x="1195" y="110"/>
  <use href="#hw2" x="1195" y="190"/>
  <use href="#dots" x="1195" y="255"/>
  <use href="#hw3" x="1195" y="320"/>

  <!-- Arrows -->
  <g stroke="#333" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <!-- UI -> CrpcUiConnection -->
    <line x1="237" y1="110" x2="293" y2="110"/>
    <line x1="237" y1="190" x2="293" y2="190"/>
    <line x1="237" y1="320" x2="293" y2="320"/>
    <!-- CrpcUiConnection -> Broker -->
    <line x1="547" y1="110" x2="603" y2="170"/>
    <line x1="547" y1="190" x2="603" y2="210"/>
    <line x1="547" y1="320" x2="603" y2="250"/>
    <!-- NAX -> CrpcHardwareConnection -->
    <line x1="1093" y1="110" x2="1037" y2="110"/>
    <line x1="1093" y1="190" x2="1037" y2="190"/>
    <line x1="1093" y1="320" x2="1037" y2="320"/>
    <!-- CrpcHardwareConnection -> Broker -->
    <line x1="783" y1="110" x2="727" y2="170"/>
    <line x1="783" y1="190" x2="727" y2="210"/>
    <line x1="783" y1="320" x2="727" y2="250"/>
  </g>
</svg>
