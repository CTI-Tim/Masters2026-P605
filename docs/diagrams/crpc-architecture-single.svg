<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="190" viewBox="0 0 1330 190" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Column groups -->
  <rect x="20" y="20" width="230" height="150" rx="10" fill="#e8f1fb" stroke="#3b78c4" stroke-width="1.5"/>
  <text x="135" y="47" text-anchor="middle" font-size="18" font-weight="bold" fill="black">UI</text>

  <rect x="270" y="20" width="790" height="150" rx="10" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
  <text x="665" y="47" text-anchor="middle" font-size="18" font-weight="bold" fill="black">Program</text>

  <rect x="1080" y="20" width="230" height="150" rx="10" fill="#e9f6ec" stroke="#3a9a52" stroke-width="1.5"/>
  <text x="1195" y="47" text-anchor="middle" font-size="18" font-weight="bold" fill="black">Hardware</text>

  <!-- Boxes -->
  <rect x="35" y="82" width="200" height="56" rx="6" fill="#ffffff" stroke="#3b78c4" stroke-width="2"/>
  <text x="135" y="115" text-anchor="middle" font-size="18" fill="#111">CH5 Panel or XPanel</text>

  <rect x="295" y="82" width="250" height="56" rx="6" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="420" y="115" text-anchor="middle" font-size="18" font-family="Consolas, Menlo, monospace" fill="#111">CrpcUiConnection()</text>

  <rect x="605" y="82" width="120" height="56" rx="6" fill="#fff4e0" stroke="#d98a00" stroke-width="2"/>
  <text x="665" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Broker</text>

  <rect x="785" y="82" width="250" height="56" rx="6" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="910" y="115" text-anchor="middle" font-size="18" font-family="Consolas, Menlo, monospace" fill="#111">CrpcHardwareConnection()</text>

  <rect x="1095" y="82" width="200" height="56" rx="6" fill="#ffffff" stroke="#3a9a52" stroke-width="2"/>
  <text x="1195" y="115" text-anchor="middle" font-size="18" fill="#111">DM-NAX-8ZSA</text>

  <!-- Arrows -->
  <g stroke="#333" stroke-width="2" marker-end="url(#arrow)">
    <line x1="237" y1="110" x2="293" y2="110"/>
    <line x1="547" y1="110" x2="603" y2="110"/>
    <line x1="1093" y1="110" x2="1037" y2="110"/>
    <line x1="783" y1="110" x2="727" y2="110"/>
  </g>
</svg>
